<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#2C5364"/>
      <stop offset="100%" stop-color="#1e3c72"/>
    </linearGradient>
    <filter id="glow3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg3)"/>

  <path d="M215,90 H320 V40 H430" fill="none" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="1.3"/>
  <path d="M215,110 H500" fill="none" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="1.3"/>
  <path d="M215,130 H320 V170 H430" fill="none" stroke="#5EEAD4" stroke-opacity="0.35" stroke-width="1.3"/>

  <circle r="3.5" fill="#5EEAD4">
    <animateMotion dur="3s" repeatCount="indefinite" path="M215,90 H320 V40 H430"/>
  </circle>
  <circle r="3.5" fill="#5EEAD4">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M215,110 H500"/>
  </circle>
  <circle r="3.5" fill="#5EEAD4">
    <animateMotion dur="3.4s" repeatCount="indefinite" path="M215,130 H320 V170 H430"/>
  </circle>

  <g filter="url(#glow3)">
    <path d="M160,45 L208,64 V118 Q208,163 160,184 Q112,163 112,118 V64 Z" fill="#123244" stroke="#5EEAD4" stroke-width="1.6"/>
    <circle cx="160" cy="112" r="18" fill="#5EEAD4" fill-opacity="0.55">
      <animate attributeName="fill-opacity" values="0.35;0.7;0.35" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="340" y="92" font-family="Consolas, 'Courier New', monospace" font-size="38" font-weight="bold" letter-spacing="1.5" fill="#ffffff">WAZUH SOC HOME LAB</text>
  <text x="342" y="124" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#8FE3D0">Security Operations Center · SIEM Monitoring</text>
  <text x="342" y="154" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#5EEAD4">$ status: endpoint monitoring active</text>
  <rect x="670" y="142" width="9" height="16" fill="#5EEAD4">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
